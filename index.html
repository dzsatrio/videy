<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 360px;
            box-sizing: border-box;
        }
        /* Slider Container */
        .slider-container {
            position: relative;
            width: 100%;
            height: 54px;
            background-color: #e4e6eb;
            border-radius: 27px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider-track {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background-color: #2b70ed;
            border-radius: 27px;
            transition: width 0.05s ease;
        }
        .slider-text {
            position: relative;
            color: #65676b;
            font-size: 14px;
            font-weight: 500;
            z-index: 1;
            pointer-events: none;
        }
        .slider-btn {
            position: absolute;
            left: 0;
            top: 0;
            width: 54px;
            height: 54px;
            background-color: #2b70ed;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .slider-btn.success {
            background-color: #28a745 !important;
        }
        /* Tombol Lanjutkan */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 27px;
            font-size: 16px;
            font-weight: 600;
            background-color: #ccd0d5;
            color: #8d949e;
            cursor: not-allowed;
            transition: background-color 0.3s, color 0.3s;
        }
        .btn-submit.active {
            background-color: #2b70ed;
            color: white;
            cursor: pointer;
        }
        .btn-submit.active:hover {
            background-color: #1d5ad8;
        }
        .footer-desc {
            font-size: 13px;
            color: #65676b;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Slider Geser -->
        <div class="slider-container" id="sliderContainer">
            <div class="slider-track" id="sliderTrack"></div>
            <span class="slider-text" id="sliderText">Geser untuk verifikasi</span>
            <div class="slider-btn" id="sliderBtn">&#8594;</div>
        </div>

        <!-- Tombol Lanjutkan -->
        <button id="submitBtn" class="btn-submit" disabled onclick="lanjutkanWeb()">Lanjutkan &rarr;</button>
        
        <div class="footer-desc">
            Langkah ini diperlukan untuk mencegah akses otomatis
        </div>
    </div>

    <script>
        const sliderBtn = document.getElementById('sliderBtn');
        const sliderContainer = document.getElementById('sliderContainer');
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderText = document.getElementById('sliderText');
        const submitBtn = document.getElementById('submitBtn');

        let isenskap = false;
        let startX = 0;
        let maxTranslate = 0;
        let isVerified = false;

        function initSlider() {
            maxTranslate = sliderContainer.offsetWidth - sliderBtn.offsetWidth;
        }

        window.addEventListener('resize', initSlider);
        initSlider();

        // Event Mouse & Touch
        sliderBtn.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        sliderBtn.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag);
        window.addEventListener('touchend', stopDrag);

        function startDrag(e) {
            if (isVerified) return;
            isenskap = true;
            startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
            e.preventDefault();
        }

        function onDrag(e) {
            if (!isenskap || isVerified) return;
            let currentX = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
            let diffX = currentX - startX;

            if (diffX < 0) diffX = 0;
            if (diffX > maxTranslate) diffX = maxTranslate;

            sliderBtn.style.transform = `translateX(${diffX}px)`;
            sliderTrack.style.width = (diffX + sliderBtn.offsetWidth) + 'px';

            if (diffX >= maxTranslate * 0.95) {
                successVerification();
            }
        }

        function stopDrag() {
            if (!isenskap || isVerified) return;
            isenskap = false;
            let currentTransform = sliderBtn.style.transform;
            let currentX = currentTransform ? parseInt(currentTransform.replace('translateX(', '').replace('px)', '')) : 0;

            if (currentX < maxTranslate * 0.95) {
                sliderBtn.style.transform = 'translateX(0px)';
                sliderTrack.style.width = '0px';
            }
        }

        function successVerification() {
            isVerified = true;
            isenskap = false;
            
            // Posisikan mentok di kanan dan kunci
            sliderBtn.style.transform = `translateX(${maxTranslate}px)`;
            sliderTrack.style.width = '100%';
            
            // Ubah teks & ikon tombol geser jadi centang hijau
            sliderText.style.display = 'none';
            sliderBtn.innerHTML = '&#10003;';
            sliderBtn.classList.add('success');
            
            // Aktifkan tombol Lanjutkan
            submitBtn.classList.add('active');
            submitBtn.removeAttribute('disabled');
        }

        function lanjutkanWeb() {
            if (submitBtn.classList.contains('active')) {
                window.location.href = 'main.html';
            }
        }
    </script>
</body>
</html>
